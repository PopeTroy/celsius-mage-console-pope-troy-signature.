name: Celsius Mage Engine
on:
  repository_dispatch:
    types: [ignite_diagnostic, ignite_mastering]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pydub yt-dlp
      - name: Execute Engine
        env:
          MAGE_MODE: ${{ github.event.event_type == 'ignite_mastering' && 'master' || 'diagnostic' }}
          WE_LINK: ${{ github.event.client_payload.we_link }}
          SESSION_ID: ${{ github.event.client_payload.session_id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mastering_logic.py
