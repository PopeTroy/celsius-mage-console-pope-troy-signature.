name: Celsius Mage Engine (UESP-PRCE)

on:
  repository_dispatch:
    types: [ignite_mastering]
  workflow_dispatch:
    inputs:
      puter_link:
        description: 'Puter.js Solid Link'
        required: true
      user_command:
        description: 'Prophetic Directive (e.g. 90s Grammy Feel)'
        default: 'Grammy Winner Standard 1958-2026'

jobs:
  dimensional_overwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Traceability Meta
        id: meta
        run: |
          echo "TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          if [ -z "${{ github.event.client_payload.session_id }}" ]; then
            echo "SESSION_ID=CELS-$(date +%s)" >> $GITHUB_ENV
          else
            echo "SESSION_ID=${{ github.event.client_payload.session_id }}" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq

      - name: Execute Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          MAGE_TIMESTAMP: ${{ env.TIMESTAMP }}
          MAGE_SESSION_ID: ${{ env.SESSION_ID }}
          AUDIO_LINK: ${{ github.event.inputs.puter_link || github.event.client_payload.puter_link }}
          USER_COMMAND: ${{ github.event.inputs.user_command || github.event.client_payload.user_command }}
        run: python engine.py
