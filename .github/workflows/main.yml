name: Celsius Mage Engine Dispatcher

on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  run_circuit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate UESP Metadata
        run: |
          echo "MAGE_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "MAGE_SESSION_ID=${{ github.event.client_payload.session_id }}" >> $GITHUB_ENV

      - name: Master & Inject Signature
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUDIO_LINK: ${{ github.event.client_payload.puter_link }}
          ARTIST: ${{ github.event.client_payload.artist_name }}
          SONG: ${{ github.event.client_payload.song_title }}
          PRODUCER: ${{ github.event.client_payload.producer }}
          USER_COMMAND: ${{ github.event.client_payload.user_command }}
        run: |
          pip install requests groq
          python engine.py

      - name: Update Session Log
        run: |
          git config --global user.name "Celsius Mage Bot"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          git add latest_session.json
          git commit -m "Logged Master: ${{ env.ARTIST }} - ${{ env.SONG }}"
          git push
