name: Celsius Mage Engine Dispatcher

on:
  workflow_dispatch:
    inputs:
      puter_link: { description: 'Puter Direct Link', required: true }
      artist_name: { description: 'Artist', required: true }
      song_title: { description: 'Song', required: true }
      producer: { description: 'Producer', required: true }
      user_command: { description: 'Prophetic Goal', required: true }

jobs:
  run_circuit:
    name: "Execute UESP PRCE Master"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Environment Setup
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq

      - name: Set Variables
        run: |
          echo "MAGE_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "AUDIO_LINK=${{ github.event.inputs.puter_link }}" >> $GITHUB_ENV
          echo "ARTIST=${{ github.event.inputs.artist_name }}" >> $GITHUB_ENV
          echo "SONG=${{ github.event.inputs.song_title }}" >> $GITHUB_ENV
          echo "PRODUCER=${{ github.event.inputs.producer }}" >> $GITHUB_ENV
          echo "USER_COMMAND=${{ github.event.inputs.user_command }}" >> $GITHUB_ENV

      - name: Execute Expert Master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mastering_logic.py

      - name: Force Push to Repository
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          git add latest_session.json
          git add -f "*.mp3" || echo "No file produced"
          git diff --staged --quiet || (git commit -m "Master Published: $ARTIST - $SONG" && git push origin main)
