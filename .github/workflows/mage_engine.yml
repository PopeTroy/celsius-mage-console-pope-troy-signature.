name: UESP Resonance Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: patch1 # Explicitly target the patch1 branch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI Hive Dependencies
        run: |
          pip install requests groq python-control
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute SHI Ingestor
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NASA_DONKI_KEY: ${{ secrets.NASA_DONKI_KEY }}
          OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python ingestor.py

      - name: Authenticated Sovereignty Push
        env:
          MY_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name 'SHI-Bot'
          git config --global user.email 'bot@celsiusmediagroup.co.za'
          
          # Force the remote to use the PAT and target patch1
          git remote set-url origin https://x-access-token:${MY_PAT}@github.com/PopeTroy/celsius-mage-console-pope-troy-signature.git
          
          if [ -f faimm-logic.json ]; then
            git add faimm-logic.json
            
            # Check for changes to avoid Exit Code 1 (the 'no changes' error)
            if git diff --staged --quiet; then
              echo "Resonance stable. No changes."
            else
              git commit -m "SHI Pulse: $(date) [patch1]"
              git push origin patch1 
            fi
          else
            echo "CRITICAL: faimm-logic.json missing."
            exit 1
          fi
