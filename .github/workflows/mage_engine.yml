name: UESP Resonance Sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI Hive Dependencies
        run: pip install -r requirements.txt

      - name: Execute SHI Ingestor
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NASA_DONKI_KEY: ${{ secrets.NASA_DONKI_KEY }}
          OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python ingestor.py

      - name: Push Dimensional Update
        run: |
          git config --global user.name 'SHI-Bot'
          git config --global user.email 'bot@celsiusmediagroup.co.za'
          
          # Check if the file was actually created
          if [ -f faimm-logic.json ]; then
            git add faimm-logic.json
            
            # Only commit if there are changes to avoid Exit Code 1
            if git diff --staged --quiet; then
              echo "No changes detected in resonance. Skipping commit."
            else
              git commit -m "SHI Pulse: $(date)"
              git push
            fi
          else
            echo "ERROR: faimm-logic.json not found! Check ingestor.py logs."
            exit 1
          fi
