name: Celsius Mage Engine (UESP-PRCE)

on:
  workflow_dispatch:
    inputs:
      puter_link:
        description: 'Puter.js Solid Link'
        required: true
      user_command:
        description: 'Command'
        default: 'Grammy Standard'
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  mastering_circuit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Traceability Metadata
        id: meta
        run: |
          # Generate ISO 8601 Timestamp & Unique Session ID
          echo "TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          # Generate a unique ID if one wasn't passed by WordPress
          if [ -z "${{ github.event.client_payload.session_id }}" ]; then
            echo "SESSION_ID=CELS-$(date +%s%N)" >> $GITHUB_ENV
          else
            echo "SESSION_ID=${{ github.event.client_payload.session_id }}" >> $GITHUB_ENV
          fi

      - name: Setup Python & Dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Dimensional Overwrite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # The Python script now inherits these from the environment
          MAGE_TIMESTAMP: ${{ env.TIMESTAMP }}
          MAGE_SESSION_ID: ${{ env.SESSION_ID }}
        run: |
          python engine.py \
            --link "${{ github.event.inputs.puter_link || github.event.client_payload.puter_link }}" \
            --command "${{ github.event.inputs.user_command || github.event.client_payload.user_command }}"
