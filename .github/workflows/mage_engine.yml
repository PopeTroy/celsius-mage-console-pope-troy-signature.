name: Celsius Mage Engine (Daikokuten Shadow Clone Swarm)

on:
  workflow_dispatch:
    inputs:
      artist_name: { description: 'Artist Identity', required: true, default: 'Pope Troy' }
      song_title: { description: 'Song Title', required: true, default: 'Pergamum' }
      producer: { description: 'Producer', required: true, default: 'Celsius Media Group' }
      user_command: { description: 'Prophetic Goal / Swarm Trigger', required: true }

jobs:
  run_circuit:
    name: "Execute NVIDIA PRCE Swarm"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code (Sovereignty Handshake)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Studio Setup (NVIDIA AI & Feedback Stack)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # 'control' and 'river' for diagnostics, 'nvidia-pyindex' for potential NIM scaling
          pip install requests groq control river nvidia-pyindex 

      - name: Execute Daikokuten Master (80 Shadow Clones)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_SECRET }} # The Nvidia AI Bridge
          MAGE_TIMESTAMP: ${{ github.event.repository.updated_at }}
          ARTIST: ${{ github.event.inputs.artist_name }}
          SONG: ${{ github.event.inputs.song_title }}
          USER_COMMAND: ${{ github.event.inputs.user_command }}
        run: python mastering_logic.py

      - name: Sovereignty Push
        env:
          MY_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          
          # Force the remote to acknowledge the terminal dot in the repository name
          git remote set-url origin https://x-access-token:${MY_PAT}@github.com/PopeTroy/celsius-mage-console-pope-troy-signature..git
          
          git add latest_session.json
          git add -f "*.mp3" || echo "No masters acquired."
          
          if ! git diff --cached --quiet; then
            git commit -m "Daikokuten Master Published: ${{ github.event.inputs.song_title }} [80 AI Clones Active]"
            git push origin main
          else
            echo "No changes in circuit resonance. Swarm complete."
          fi
