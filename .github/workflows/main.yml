name: Celsius Mage - King of Engines
on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  mastering:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Audio Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Acoustic Tools (FFmpeg/DSP)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pydub yt-dlp

      - name: Execute Global Standard Mastering
        env:
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
        run: python mastering_logic.py

      - name: Force Handshake to WordPress
        if: success()
        run: |
          curl -L -v -X POST "https://celsiusmediagroup.co.za/wp-admin/admin-ajax.php" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          -F "action=celsius_capture_master" \
          -F "master_file=@output_render.mp3" \
          -F "artist=${{ github.event.client_payload.artist }}" \
          -F "song=${{ github.event.client_payload.song }}"
