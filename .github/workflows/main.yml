name: CELSIUS MAGE CONSOLE ENGINE
on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Install System DSP
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Mage Console with Groq Intelligence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python mastering_logic.py \
          "${{ github.event.client_payload.artist }}" \
          "${{ github.event.client_payload.song }}" \
          "${{ github.event.client_payload.instruments }}" \
          "${{ github.event.client_payload.goals }}" \
          "${{ github.event.client_payload.song_url }}" \
          "${{ github.event.client_payload.ref_url }}"

      - name: Upload Final Render
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.song }}_WINNER
          path: ./*_WINNER.wav
