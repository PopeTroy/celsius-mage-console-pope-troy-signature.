name: Celsius Mage Engine
on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  mastering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Professional Audio Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pydub

      - name: Execute PRCE Mastering Chain
        env:
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
        run: python mastering_logic.py

      - name: Post-Back Mastered Render to Celsius Media
        if: success()
        run: |
          curl -X POST "https://celsiusmediagroup.co.za/wp-admin/admin-ajax.php" \
          -F "action=celsius_receive_master" \
          -F "master_file=@output_render.mp3" \
          -F "artist=${{ github.event.client_payload.artist }}" \
          -F "song=${{ github.event.client_payload.song }}"
