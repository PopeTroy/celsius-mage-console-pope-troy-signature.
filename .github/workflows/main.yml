name: Celsius Mage - Interactive Engine
on:
  repository_dispatch:
    types: [ignite_diagnostic, ignite_mastering]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Mastering Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pydub yt-dlp

      - name: Execute PRCE V12 Logic
        env:
          MAGE_MODE: ${{ github.event.event_type == 'ignite_mastering' && 'master' || 'diagnostic' }}
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mastering_logic.py
