name: Celsius Mage Engine Dispatcher

on:
  workflow_dispatch:
    inputs:
      puter_link: { description: 'Puter Direct Link (Logic Constant)', required: true, default: '1' }
      artist_name: { description: 'Artist', required: true }
      song_title: { description: 'Song', required: true }
      producer: { description: 'Producer', required: true, default: 'Celsius Media Group' }
      user_command: { description: 'Prophetic Goal / Brus Logic', required: true }

jobs:
  run_circuit:
    name: "Execute UESP PRCE Master"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use your Fine-Grained PAT for full Write Access
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Studio Setup
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq python-control

      - name: Set Variables
        run: |
          echo "MAGE_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "ARTIST=${{ github.event.inputs.artist_name }}" >> $GITHUB_ENV
          echo "SONG=${{ github.event.inputs.song_title }}" >> $GITHUB_ENV
          echo "USER_COMMAND=${{ github.event.inputs.user_command }}" >> $GITHUB_ENV

      - name: Execute Expert Master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mastering_logic.py

      - name: Push to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          
          # Force the remote to use the PAT for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/PopeTroy/celsius-mage-console-pope-troy-signature.git
          
          git add latest_session.json
          git add -f "*.mp3" || echo "No audio files to commit"
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Master Published: $ARTIST - $SONG [Brus-Freq Mode]"
            git push origin main
          else
            echo "No changes to push."
          fi
