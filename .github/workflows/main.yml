name: Celsius Mage Engine - Global Standard
on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  mastering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Audio Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Professional Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pydub

      - name: Expert Mastering Logic
        env:
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
        run: python mastering_logic.py

      - name: Secure Return to WordPress
        if: success()
        run: |
          curl -X POST "https://celsiusmediagroup.co.za/wp-admin/admin-ajax.php" \
          -H "User-Agent: CelsiusEngine/1.0" \
          -F "action=celsius_capture_master" \
          -F "master_file=@output_render.mp3" \
          -F "artist=${{ github.event.client_payload.artist }}" \
          -F "song=${{ github.event.client_payload.song }}"
