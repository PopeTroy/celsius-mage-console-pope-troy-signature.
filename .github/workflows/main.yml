name: Celsius Mage Engine
on:
  repository_dispatch:
    types: [ignite_mastering] # THIS MUST MATCH THE PHP 'event_type'

jobs:
  mastering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
        run: python mastering_logic.py
