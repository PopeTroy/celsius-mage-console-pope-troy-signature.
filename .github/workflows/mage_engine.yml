name: Celsius Mage Engine Dispatcher

on:
  workflow_dispatch:
    inputs:
      puter_link: { description: 'Logic Constant', required: true, default: '1' }
      artist_name: { description: 'Artist', required: true }
      song_title: { description: 'Song', required: true }
      producer: { description: 'Producer', required: true, default: 'Celsius Media Group' }
      user_command: { description: 'Prophetic Goal / Brus Logic', required: true }

jobs:
  run_circuit:
    name: "Execute UESP PRCE Master"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Studio Setup
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq

      - name: Execute Expert Master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAGE_TIMESTAMP: ${{ github.event.repository.updated_at }}
          ARTIST: ${{ github.event.inputs.artist_name }}
          SONG: ${{ github.event.inputs.song_title }}
          USER_COMMAND: ${{ github.event.inputs.user_command }}
        run: python mastering_logic.py

      - name: Push Master to Repository
        env:
          MY_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          
          # Force remote to use PAT to clear the 403 error
          git remote set-url origin https://x-access-token:${MY_PAT}@github.com/PopeTroy/celsius-mage-console-pope-troy-signature.git
          
          git add latest_session.json
          git add -f "*.mp3" || echo "No files to add"
          
          if ! git diff --cached --quiet; then
            git commit -m "Master Published: $ARTIST - $SONG [Main Branch Ignition]"
            git push origin main
          else
            echo "No changes to push."
          fi
