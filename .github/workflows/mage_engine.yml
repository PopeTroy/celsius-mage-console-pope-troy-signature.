name: Celsius Mage Engine Dispatcher

on:
  workflow_dispatch:
    inputs:
      puter_link: { description: 'Puter Solid Link', required: true }
      artist_name: { description: 'Artist Name', required: true }
      song_title: { description: 'Song Title', required: true }
      producer: { description: 'Producer Name', required: true }
      user_command: { description: 'Prophetic Goal (e.g., 90s Grammy Hip-Hop)', required: true }

  repository_dispatch:
    types: [ignite_mastering]

jobs:
  run_circuit:
    name: "Execute UESP PRCE Master"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Meta-Data
        run: |
          echo "MAGE_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          
          if [ -z "${{ github.event.client_payload.session_id }}" ]; then
            echo "MAGE_SESSION_ID=CELS-$(date +%s)" >> $GITHUB_ENV
          else
            echo "MAGE_SESSION_ID=${{ github.event.client_payload.session_id }}" >> $GITHUB_ENV
          fi

      - name: Set Circuit Environment
        run: |
          echo "AUDIO_LINK=${{ github.event.inputs.puter_link || github.event.client_payload.puter_link }}" >> $GITHUB_ENV
          echo "ARTIST=${{ github.event.inputs.artist_name || github.event.client_payload.artist_name }}" >> $GITHUB_ENV
          echo "SONG=${{ github.event.inputs.song_title || github.event.client_payload.song_title }}" >> $GITHUB_ENV
          echo "PRODUCER=${{ github.event.inputs.producer || github.event.client_payload.producer }}" >> $GITHUB_ENV
          echo "USER_COMMAND=${{ github.event.inputs.user_command || github.event.client_payload.user_command }}" >> $GITHUB_ENV

      - name: Install Studio Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq

      - name: Execute Expert Master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mastering_logic.py

      - name: Push Master to Repository
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          
          # Force adding MP3s to ensure visibility on GitHub
          git add latest_session.json
          git add -f "*.mp3"
          
          if git diff --staged --quiet; then
            echo "No changes found."
          else
            git commit -m "Live Master Published: $ARTIST - $SONG"
            git push origin main
          fi
