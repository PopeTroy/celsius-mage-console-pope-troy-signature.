name: Celsius Mage Mastering Engine
on:
  repository_dispatch:
    types: [ignite_mastering]

jobs:
  dsp_process:
    runs-on: ubuntu-latest
    steps:
      - name: System Checkout
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Professional Audio Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq pydub

      - name: Execute PRCE Mastering Chain
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WE_LINK: ${{ github.event.client_payload.we_link }}
          ARTIST: ${{ github.event.client_payload.artist }}
          SONG: ${{ github.event.client_payload.song }}
        run: python mastering_logic.py

      - name: Post-Back Mastered Render to Celsius Media
        run: |
          # This sends the final file back to your WordPress media endpoint
          curl -X POST "https://celsiusmediagroup.co.za/wp-admin/admin-ajax.php" \
          -F "action=celsius_receive_master" \
          -F "master_file=@$(ls *.mp3)" \
          -F "job_id=${{ github.event.client_payload.song }}"
