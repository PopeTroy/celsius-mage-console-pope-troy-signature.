name: Celsius Mage Engine Dispatcher

on:
  repository_dispatch:
    types: [ignite_mastering]
  workflow_dispatch:
    inputs:
      audio_link:
        description: 'Puter Link'
      user_command:
        description: 'Prophetic Goal'

jobs:
  run_circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Meta
        run: |
          echo "MAGE_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "MAGE_SESSION_ID=CELS-$(date +%s)" >> $GITHUB_ENV
          echo "AUDIO_LINK=${{ github.event.client_payload.puter_link || github.event.inputs.audio_link }}" >> $GITHUB_ENV
          echo "USER_COMMAND=${{ github.event.client_payload.user_command || github.event.inputs.user_command }}" >> $GITHUB_ENV

      - name: Master Audio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install requests groq
          python engine.py
